b1.2.1.1:
  definition: 打点计时器按固定时间间隔在纸带上留下点迹，可由相邻点间距求速度和加速度。
  law: 短时间内的平均速度可近似为中间时刻的瞬时速度。
  misconceptions: [直接用点到点距离当速度, 忘记交流电频率决定打点周期]
  example: 频率 50 Hz 时每 5 个时间间隔取一个计数点，相邻计数点时间为 0.10 s。
b1.2.2.1:
  definition: 沿直线运动且加速度保持不变的运动叫匀变速直线运动。
  law: 相等时间内速度变化量相等。
  misconceptions: [把匀变速理解成速度不变, 认为加速度为负就一定减速]
  example: 小车每秒速度增加 2 m/s，是加速度为 2 m/s² 的匀加速运动。
b1.2.2.2:
  definition: 匀变速直线运动中，任意时刻速度由初速度和加速度共同决定。
  law: v = v₀ + at
  misconceptions: [忽略正方向导致符号错误, 把速度公式用于变加速运动]
  example: v₀=3 m/s、a=2 m/s²，4 s 后 v=11 m/s。
b1.2.3.1:
  definition: 匀变速直线运动的位移等于初速度贡献与加速度贡献之和。
  law: x = v₀t + ½at²
  misconceptions: [把位移当路程, 漏写二分之一或时间平方]
  example: 从静止以 2 m/s² 加速 3 s，位移为 9 m。
b1.2.3.2:
  definition: 消去时间后，可直接联系匀变速运动的速度与位移。
  law: v² - v₀² = 2ax
  misconceptions: [把速度平方差写成速度差的平方, 位移和加速度符号不统一]
  example: 从静止以 2 m/s² 运动 9 m，末速度为 6 m/s。
b1.2.3.3:
  definition: 匀变速运动可用平均速度、中间时刻速度和相邻相等时间位移差等推论简化计算。
  law: v平均 = (v₀ + v)/2；Δx = aT²
  misconceptions: [把平均速度公式用于任意运动, 混淆相邻位移差与总位移]
  example: 连续两秒位移分别为 3 m、5 m，则加速度为 2 m/s²。
b1.2.4.1:
  definition: 物体只在重力作用下从静止开始下落的运动叫自由落体运动。
  law: v = gt；h = ½gt²
  misconceptions: [认为重物比轻物下落快, 忽略自由落体要求初速度为零且空气阻力可忽略]
  example: 取 g=10 m/s²，自由下落 2 s 的速度为 20 m/s、位移为 20 m。
b1.2.4.2:
  definition: 同一地点所有物体自由落体的加速度相同，方向竖直向下，称重力加速度。
  law: 地面附近常取 g=9.8 m/s²，题目说明时可取 10 m/s²。
  misconceptions: [认为 g 与物体质量有关, 计算时混用 9.8 和 10]
  example: 竖直向下取正时，自由落体加速度写作 +g；向上取正时写作 -g。
b1.4.1.1:
  definition: 伽利略用斜面实验和逻辑推理说明，没有阻力时运动物体将保持运动状态。
  law: 理想实验突出主要因素，是现实实验与逻辑推理的结合。
  misconceptions: [把理想实验当成真实完成的无摩擦实验, 认为力是维持运动的原因]
  example: 小球从一斜面滚下并冲上另一斜面，阻力越小，上升高度越接近原高度。
b1.4.1.2:
  definition: 一切物体总保持匀速直线运动状态或静止状态，除非作用在它上面的力迫使它改变这种状态。
  law: 合力为零时，物体保持静止或匀速直线运动。
  misconceptions: [认为不受力的物体只能静止, 把惯性定律当作牛顿第二定律的特例]
  example: 冰面上滑动的冰壶在阻力很小时近似保持匀速直线运动。
b1.4.1.3:
  definition: 惯性是物体保持原有运动状态的性质，质量是惯性大小的唯一量度。
  law: 质量越大，运动状态越难改变。
  misconceptions: [说物体受到惯性作用, 认为速度越大惯性越大]
  example: 同样的力推空车和满载车，满载车质量大、加速度小，体现惯性更大。
b1.4.2.1:
  definition: 探究加速度与力、质量关系时，每次只改变一个因素，其余条件保持不变。
  law: 固定质量研究 a-F；固定力研究 a-1/m。
  misconceptions: [同时改变力和质量, 用曲线是否过原点代替误差分析]
  example: 作 a-F 图像应近似为过原点直线；作 a-1/m 图像也应近似为过原点直线。
b1.4.3.1:
  definition: 物体加速度的大小与所受合力成正比、与质量成反比，方向与合力方向相同。
  law: F合 = ma
  misconceptions: [把某一个力直接代入 F=ma, 认为速度方向必与合力方向相同]
  example: 2 kg 物体受 6 N 水平合力，加速度为 3 m/s²，方向与合力相同。
b1.4.3.2:
  definition: 在国际单位制中，使 1 kg 物体产生 1 m/s² 加速度的力定义为 1 N。
  law: 1 N = 1 kg·m/s²
  misconceptions: [把牛顿当作质量单位, 代公式时混用克和千克]
  example: 0.5 kg 物体产生 4 m/s² 加速度所需合力为 2 N。
b1.4.4.1:
  definition: 基本量的单位叫基本单位，由基本单位组合得到的单位叫导出单位。
  law: 力的单位 kg·m/s² 是由质量、长度、时间基本单位导出的。
  misconceptions: [认为常用单位都是基本单位, 把物理量和单位混为一谈]
  example: 米、千克、秒是基本单位；米每秒、牛顿是导出单位。
b1.4.4.2:
  definition: 国际单位制规定一套统一的基本单位和导出单位，力学基本单位是米、千克、秒。
  law: 计算前应把各物理量统一换成 SI 单位。
  misconceptions: [把厘米直接代入以米为单位的公式, 认为克是 SI 质量基本单位]
  example: 500 g 应先换成 0.5 kg，20 cm 应先换成 0.20 m。
b1.4.5.1:
  definition: 已知物体受力求运动时，先受力分析求合力，再由牛顿第二定律求加速度，最后用运动学公式。
  law: 受力分析 → F合=ma → 运动学关系
  misconceptions: [未选正方向就列式, 漏掉摩擦力或支持力]
  example: 水平拉动木块时，先由拉力与摩擦力求水平合力，再求加速度和位移。
b1.4.5.2:
  definition: 已知运动情况求受力时，先由运动学关系求加速度，再由牛顿第二定律求合力或未知力。
  law: 运动学关系 → a → F合=ma → 未知力
  misconceptions: [把速度直接乘质量当作力, 求出合力后忘记分解到具体力]
  example: 由电梯速度随时间的变化求加速度，再结合重力与支持力求支持力。
b1.4.6.1:
  definition: 物体对支持物的压力大于重力时为超重，小于重力时为失重；物体重力本身没有改变。
  law: 竖直向上为正时，支持力 N = m(g+a)。
  misconceptions: [认为超重时重力变大, 仅凭速度向上或向下判断超重失重]
  example: 电梯向上加速时超重，向上减速时失重。
b1.4.6.2:
  definition: 物体对支持物的压力为零的状态叫完全失重，此时物体仍受重力。
  law: 自由落体时 a = g，支持力 N = 0。
  misconceptions: [认为完全失重就是没有重力, 认为只有太空中才会完全失重]
  example: 自由下落的电梯舱内，人与秤共同以 g 加速，秤的示数为零。
