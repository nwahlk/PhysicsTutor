name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: 静态检查
        run: ruff check --select E9,F .
      - name: 单元与契约测试
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: 等待 readiness
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8401/readyz > /dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: 迁移幂等 + 两 worker + 结构化练习续答
        run: |
          test "$(docker compose ps -a --format '{{.Service}} {{.State}}' | grep -c '^migrate exited')" = "1"
          docker compose run --rm migrate | grep -q '已是最新'
          test "$(docker compose logs app | grep -c 'Started server process')" -ge 2
          curl -fsS http://127.0.0.1:8401/ | grep -q '引力场'
          curl -fsS http://127.0.0.1:8401/catalog | grep -q '牛顿第二定律'
          FIRST=$(curl -fsS -X POST http://127.0.0.1:8401/chat -H 'Content-Type: application/json' \
            -d '{"student_id":"ci","thread_id":"ci-1","message":"practice","kp_id":"b1.2.4.1","mode":"practice"}')
          QUESTION_ID=$(printf '%s' "$FIRST" | python -c 'import json,sys; print(next(json.loads(line[6:])["payload"]["question"]["id"] for line in sys.stdin if line.startswith("data: ") and json.loads(line[6:])["type"] == "interrupt"))')
          WRONG="{\"student_id\":\"ci\",\"thread_id\":\"ci-1\",\"answer\":{\"kind\":\"calculation\",\"question_id\":\"$QUESTION_ID\",\"final\":{\"value\":\"0\",\"unit\":\"kg\",\"direction\":\"up\"},\"steps\":[]}}"
          curl -fsS -X POST http://127.0.0.1:8401/answer -H 'Content-Type: application/json' -d "$WRONG" | grep -q '"hint"'
          docker compose restart app
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8401/readyz > /dev/null && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8401/history?student_id=ci&thread_id=ci-1" | grep -q "$QUESTION_ID"
          curl -fsS -X POST http://127.0.0.1:8401/answer -H 'Content-Type: application/json' -d "$WRONG" | grep -q '"solution_revealed":true'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8401/answer -H 'Content-Type: application/json' -d "$WRONG")" = "409"
      - if: always()
        run: docker compose down -v
